name: Kronos for Latest Ubuntu

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
    - name: Install qt
      run: sudo apt update && sudo apt install build-essential libgl1-mesa-dev qt6-base-dev
    - name: Run qmake for Kronos
      run: qmake
    - name: Build Kronos
      run: make -j8
    - name: Build unit tests
      run: cd tests && qmake kronos-tests.pro && make -j8

